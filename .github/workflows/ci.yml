name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: lint & syntax check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install role requirements
        run: pip install -r requirements.txt

      - name: Create ansible.cfg
        run: "printf '[defaults]\nroles_path=./tests/requirements/:../' > ansible.cfg"

      - name: ansible-lint
        uses: ansible/ansible-lint@v26.8.0

      - name: ansible-playbook syntax check
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        with:
          playbook: tests/test.yml
          directory: "."
          requirements: tests/requirements.yml
          options: --syntax-check -i tests/inventory
